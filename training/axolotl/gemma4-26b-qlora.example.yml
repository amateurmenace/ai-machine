# QLoRA starting configuration for a community adapter.
#
# Section 10 of the guide: do not fine-tune the quantized GGUF that LM Studio
# serves. Train from the original checkpoint, produce an adapter, then merge and
# quantize for inference.
#
# Treat this as a starting point, not a guarantee. Hardware requirements depend
# on sequence length, batch configuration, optimizer and model details.
#
#   axolotl train training/axolotl/gemma4-26b-qlora.example.yml

base_model: google/gemma-4-26b-a4b        # the original checkpoint, not the GGUF
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
adapter: qlora

datasets:
  - path: training/datasets/constitution-v1.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: training/datasets/.prepared
val_set_size: 0.1
output_dir: training/adapters/community-general-v1

sequence_len: 4096          # the constitution and retrieved passages are long
sample_packing: true
pad_to_sequence_len: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 3
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
gradient_checkpointing: true
flash_attention: true

warmup_ratio: 0.03
evals_per_epoch: 2
saves_per_epoch: 1
weight_decay: 0.0

special_tokens:
  pad_token: "<pad>"
